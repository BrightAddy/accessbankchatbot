apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.appSecrets.openaiApiKey | quote }}
  WHATSAPP_TOKEN: {{ .Values.appSecrets.whatsappToken | quote }}
  PHONE_NUMBER_ID: {{ .Values.appSecrets.phoneNumberId | quote }}
  VERIFY_TOKEN: {{ .Values.appSecrets.verifyToken | quote }}
